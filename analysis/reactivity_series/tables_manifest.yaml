- table_id: peroxide_radical_abstraction
  description: "Relative rates of hydrogen abstraction during autoxidation of alkenes by peroxyl radicals at 30 °C."
  reaction_template: "[C:1]=[C:2]>>[C:1][C:2]OO"
  reactivity_type: "k_rel"
  units: "relative rate (dimensionless)"
  context: "Peroxyl radicals abstract allylic and doubly allylic C–H bonds far more rapidly than non-conjugated alkenes because conjugation stabilizes the resulting carbon radical. The trend matches biological autoxidation and lipoxygenase catalysis, where allylic radical stabilization controls selectivity."
  source_ref: "Howard_Ingold_2011"
  source_page: 796
  provenance_type: "data_extracted"

- table_id: aryl_bromination
  description: "Relative rates of electrophilic aromatic bromination of benzene derivatives."
  reaction_template: "[c:1]([*:7])1[cH:2][c:3][cH:4][c:5][cH:6]1>>[c:1]([*:7])1[cH:2][c:3][c:4](Br)[c:5][cH:6]1"
  reactivity_type: "k"
  units: "1/M·s"
  context: "This table reports relative rates of bromination for para-substituted benzene derivatives, illustrating the strong activating influence of electron-donating substituents. Electron-donating groups stabilize the σ-complex intermediate formed during electrophilic attack by delocalizing positive charge into the ring, greatly accelerating substitution. Methyl (inductive) and especially methoxy or hydroxy (resonance) groups show dramatic rate enhancement compared to unsubstituted benzene, while dimethylamino provides an even stronger resonance donation. The comparable reactivity of OH and OCH₃ highlights that both groups donate through resonance to a similar extent."
  source_ref: "carey_sundberg_volA_3ed"
  source_page: 588
  provenance_type: "verbatim_reproduction"

- table_id: cyclopentadiene_diels_alder
  description: "Relative reactivity toward cyclopentadiene in the Diels-Alder reaction."
  reaction_template: "[C:1]=[C:2]>>C1=CC2[C:1][C:2]C1C2"
  reactivity_type: "k"
  units: "relative rate (dimensionless)"
  context: "This table compares the relative reactivities of substituted alkenes (dienophiles) in Diels–Alder reactions with cyclopentadiene. Electron-withdrawing substituents such as –CN, –COOR, and –C=O greatly accelerate the reaction by lowering the alkene’s LUMO and stabilizing charge buildup in the polarized transition state. The rates span many orders of magnitude, showing how substituents can dramatically alter diene–dienophile reactivity. Geometric isomers (cis/trans) and modestly activated esters display smaller effects, but the overall trend highlights the dominant role of π-acceptor substituents in promoting Diels–Alder cycloadditions."
  source_ref: "carey_sundberg_volB_3ed"
  source_page: 631
  provenance_type: "verbatim_reproduction"